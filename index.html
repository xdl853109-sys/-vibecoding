<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔幻远征 · 西方魔幻闯关 RPG</title>
<style>
/* ==========================================================================
   魔幻远征 · 样式表
   1. 基础与变量   2. 顶栏 / 底栏   3. 通用组件
   4. 战斗界面     5. 世界地图     6. 角色 / 背包 / 锻造 / 商店 / 宝箱
   7. 弹窗 / 提示  8. 地图主题     9. 响应式
   ========================================================================== */

/* ---------- 1. 基础与变量 ---------- */
*{box-sizing:border-box}
:root{
  --gold:#e8c26a; --gold-2:#f8e6ae; --gold-3:#a97b2e;
  --text:#ece7f7; --muted:#a79fc0; --dim:#7c7494;
  --line:rgba(232,194,106,.24); --line-2:rgba(255,255,255,.08);
  --panel:linear-gradient(160deg,rgba(32,24,54,.88),rgba(15,11,27,.92));
  --ok:#5ee0a0; --bad:#ff6b81; --warn:#ffd166;
  --rc:#b9b6c7;
  --shadow:0 12px 34px rgba(0,0,0,.42);
}
html,body{height:100%}
body{margin:0;background:#07050e;color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
input[type=checkbox]{width:14px;height:14px;accent-color:#e8c26a;vertical-align:-2px;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:.4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(232,194,106,.28);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{position:relative;min-height:100vh;display:flex;flex-direction:column;
  background:
    radial-gradient(1200px 640px at 50% -12%, rgba(126,82,208,.20), transparent 62%),
    radial-gradient(700px 400px at 100% 100%, rgba(60,30,110,.20), transparent 60%),
    linear-gradient(180deg,#0c0818 0%,#070510 55%,#0a0614 100%);
  transition:background .45s ease}
.starbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.75;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1.2px 1.2px at 42% 68%,rgba(210,190,255,.6),transparent 60%),
    radial-gradient(1.8px 1.8px at 77% 18%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.2px 1.2px at 88% 74%,rgba(255,225,170,.6),transparent 60%);
  background-size:260px 260px,320px 320px,380px 380px,440px 440px;
  animation:starDrift 90s linear infinite}
@keyframes starDrift{from{background-position:0 0,0 0,0 0,0 0}to{background-position:260px 520px,-320px 320px,380px -380px,-440px 440px}}

/* ---------- 2. 顶栏 / 底栏 ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 16px;background:rgba(11,8,20,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;letter-spacing:1px;
  background:linear-gradient(180deg,var(--gold-2),var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(232,194,106,.18);white-space:nowrap}
.brand-ico{font-size:19px;-webkit-text-fill-color:initial;filter:drop-shadow(0 0 8px rgba(232,194,106,.55))}
.resbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12.5px;
  background:rgba(255,255,255,.045);border:1px solid var(--line-2);white-space:nowrap;color:var(--muted)}
.chip b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.chip.gold{border-color:rgba(232,194,106,.35);color:var(--gold-2)}
.chip.gem{border-color:rgba(120,180,255,.35);color:#a8cdff}
.chip.star{border-color:rgba(255,215,120,.35);color:#ffe08a}
.chip.power{border-color:rgba(255,120,160,.35);color:#ffb3c8}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:16px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.18s}
.icon-btn:hover{background:rgba(232,194,106,.16);transform:translateY(-1px)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(9,7,16,.94);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -8px 26px rgba(0,0,0,.4)}
.tab{flex:0 1 108px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  border-radius:12px;background:transparent;border:1px solid transparent;color:var(--dim);font-size:11px;transition:.18s}
.tab i{font-style:normal;font-size:19px;line-height:1.1;filter:grayscale(.5);transition:.18s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.on{color:var(--gold-2);background:linear-gradient(180deg,rgba(232,194,106,.16),rgba(232,194,106,.05));
  border-color:rgba(232,194,106,.38);box-shadow:0 0 18px rgba(232,194,106,.14) inset}
.tab.on i{filter:none;transform:translateY(-1px)}
.tab .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--bad);transform:translate(14px,-6px)}
.tab{position:relative}

/* ---------- 3. 通用组件 ---------- */
.screens{position:relative;z-index:1;flex:1;width:100%;max-width:1480px;margin:0 auto;padding:14px 16px 92px}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .26s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;
  box-shadow:var(--shadow);position:relative}
.panel.flat{box-shadow:none}
.panel-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--gold-2);margin-bottom:10px}
.panel-title .sub{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted)}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.tiny{font-size:11.5px}
.gold{color:var(--gold-2)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.center{text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:11px;
  border:1px solid rgba(232,194,106,.4);background:linear-gradient(180deg,rgba(232,194,106,.2),rgba(232,194,106,.07));
  color:var(--gold-2);font-weight:700;font-size:13px;transition:.16s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--gold);box-shadow:0 8px 20px rgba(232,194,106,.16)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#f7e2a3,#c99a3f);color:#2a1a04;border-color:#f8e6ae;
  box-shadow:0 6px 18px rgba(232,194,106,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.045);color:var(--text);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.danger{background:linear-gradient(180deg,rgba(255,107,129,.22),rgba(255,107,129,.08));
  color:#ffb3be;border-color:rgba(255,107,129,.45)}
.btn.sm{padding:5px 9px;border-radius:8px;font-size:12px}
.btn.lg{padding:11px 22px;font-size:15px;border-radius:13px}
.btn.wide{width:100%}
.btn[disabled],.btn.disabled{opacity:.4;pointer-events:none;filter:grayscale(.4)}
.btn .price{font-weight:500;font-size:11.5px;opacity:.85}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:11px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--muted)}
.tag.gold{background:rgba(232,194,106,.12);border-color:rgba(232,194,106,.35);color:var(--gold-2)}
.tag.green{background:rgba(94,224,160,.1);border-color:rgba(94,224,160,.3);color:var(--ok)}
.tag.red{background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.32);color:#ffa9b5}
.tag.blue{background:rgba(110,170,255,.1);border-color:rgba(110,170,255,.3);color:#a8cdff}

.bar{height:9px;border-radius:99px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#d9a544,#f6dfa0);transition:width .3s ease}
.bar.hp>i{background:linear-gradient(90deg,#2fbf7c,#7cf0b4)}
.bar.enemy>i{background:linear-gradient(90deg,#e0394f,#ff9d8a)}
.bar.exp>i{background:linear-gradient(90deg,#5b8cff,#a5c8ff)}

.grid{display:grid;gap:10px}
.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:13px}

/* 稀有度 */
.r-common{--rc:#b9b6c7}
.r-good{--rc:#4ade80}
.r-rare{--rc:#60a5fa}
.r-epic{--rc:#c084fc}
.r-legend{--rc:#fb923c}
.r-myth{--rc:#ef4444}
.rar{color:var(--rc);font-weight:800}

/* 物品卡片 */
.item-card{position:relative;display:flex;gap:8px;align-items:center;padding:8px;border-radius:11px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.18));
  border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.item-card .ico{width:38px;height:38px;display:grid;place-items:center;font-size:21px;border-radius:9px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),rgba(0,0,0,.25));
  border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);flex:0 0 auto}
.item-card .meta{min-width:0;flex:1}
.item-card .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-card .sub{font-size:11px;color:var(--muted)}
.equip-slot{border:1px dashed rgba(255,255,255,.16);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.025);min-height:64px;transition:.16s;cursor:pointer}
.equip-slot:hover{border-color:var(--gold);background:rgba(232,194,106,.06)}
.equip-slot .slot-ico{font-size:22px;opacity:.85;width:30px;text-align:center}
.equip-slot .slot-nm{font-size:11px;color:var(--dim)}

/* ---------- 4. 战斗界面 ---------- */
.battle-layout{display:grid;grid-template-columns:258px minmax(0,1fr) 300px;gap:12px;align-items:start}
.stage-panel .stage-name{font-size:17px;font-weight:900;color:var(--gold-2);display:flex;gap:6px;align-items:center}
.stage-panel .stage-sub{font-size:12px;color:var(--muted);margin-top:2px}
.env-banner{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:11px;margin-bottom:10px;
  background:linear-gradient(90deg,rgba(232,194,106,.14),rgba(120,80,200,.1));
  border:1px solid rgba(232,194,106,.3);font-size:12.5px;color:#f3e6c4}
.env-banner b{color:var(--gold-2)}
.env-banner .ico{font-size:17px}

.arena{position:relative;border-radius:16px;min-height:330px;overflow:hidden;
  display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:4px;padding:16px 12px 42px;
  border:1px solid var(--tLine,rgba(255,255,255,.12));box-shadow:0 18px 40px rgba(0,0,0,.45) inset,var(--shadow);
  transition:background .45s ease}
.arena-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.arena-deco span{position:absolute;opacity:.28;filter:blur(.3px) drop-shadow(0 4px 10px rgba(0,0,0,.6));user-select:none}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--tGlow,#8a6ad0) 9%,transparent))}
.arena .vs{display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:2px;
  text-shadow:0 0 14px rgba(255,255,255,.25)}
.team{display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}
.unit{position:relative;width:104px;text-align:center;transition:.2s}
.unit.boss{width:136px}
.unit .avatar{font-size:44px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));transition:transform .18s ease;display:block}
.unit.boss .avatar{font-size:62px}
.unit .uname{font-size:11px;color:#e9e2f7;margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.unit.boss .uname{color:#ffbcb0;font-size:12px}
.unit .hpbar{height:9px;border-radius:99px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.14);overflow:hidden;position:relative}
.unit .hpbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2fbf7c,#8bf5bf);transition:width .3s ease}
.unit.enemy .hpbar>i{background:linear-gradient(90deg,#d92b45,#ffa08e)}
.unit .hptxt{font-size:9.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.unit.dead{opacity:.22;filter:grayscale(1)}
.unit.dead .avatar{transform:rotate(-14deg) translateY(8px)}
.unit.acting .avatar{transform:translateY(-8px) scale(1.12)}
.unit.ally .avatar{filter:drop-shadow(0 0 14px rgba(232,194,106,.5))}
.unit.boss .hpbar{border-color:rgba(255,120,120,.5);box-shadow:0 0 14px rgba(255,80,80,.3)}
.unit .statuses{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:3px;min-height:14px;font-size:10px}
.unit .statuses span{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:0 3px}

.float{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:17px;
  color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;
  animation:floatUp .95s ease-out forwards;z-index:9;font-variant-numeric:tabular-nums}
.float.dmg{color:#ffd9a0}
.float.crit{color:#ff9d3d;font-size:23px;text-shadow:0 0 14px rgba(255,140,40,.8),0 2px 6px rgba(0,0,0,.8)}
.float.heal{color:#7cf0b4}
.float.miss{color:#c9c4dd;font-size:15px}
.float.env{color:#c9a8ff;font-size:13px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(.95)}}

.boss-banner{position:absolute;left:0;right:0;top:7%;text-align:center;z-index:6;pointer-events:none;
  padding:4px 0 6px;background:linear-gradient(90deg,transparent,rgba(80,10,14,.55),transparent);
  animation:bossIn 2.6s ease forwards;text-shadow:0 0 30px rgba(255,50,50,.8),0 4px 10px #000}
.boss-banner .bb-sub{font-size:11px;letter-spacing:8px;color:#ff9d8a;font-weight:800}
.boss-banner .bb-name{font-size:26px;font-weight:900;color:#ffd0c8;letter-spacing:2px}
@keyframes bossIn{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}
  14%{opacity:1;transform:scale(1);filter:blur(0)}
  70%{opacity:1;transform:scale(1.02)}
  100%{opacity:0;transform:scale(1.06)}}
.spark{position:fixed;font-size:18px;color:#ffd76a;text-shadow:0 0 14px #ffb84d,0 0 4px #fff;
  pointer-events:none;z-index:96;animation:sparkUp 1.3s ease-out forwards}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) scale(.5)}
  18%{opacity:1;transform:translateY(-10px) scale(1.15)}
  100%{opacity:0;transform:translateY(-190px) scale(.9)}}
@keyframes shakeUnit{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-3deg)}
  55%{transform:translateX(5px) rotate(3deg)}80%{transform:translateX(-2px)}}
.unit.hit .avatar{animation:shakeUnit .3s ease}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}45%{transform:translate(4px,-2px)}
  70%{transform:translate(-2px,-1px)}}
.arena.shake{animation:screenShake .26s ease}

.battle-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.manual-hint{font-size:12px;color:var(--warn);animation:pulseOp 1.2s ease-in-out infinite}
@keyframes pulseOp{0%,100%{opacity:.6}50%{opacity:1}}

.skillbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;min-height:64px}
.skill{position:relative;width:78px;padding:6px 4px;border-radius:11px;text-align:center;
  background:linear-gradient(180deg,rgba(60,44,96,.85),rgba(24,18,40,.92));
  border:1px solid rgba(232,194,106,.3);transition:.16s;overflow:hidden}
.skill:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 18px rgba(232,194,106,.16)}
.skill .sico{font-size:20px;line-height:1.1;display:block}
.skill .snm{font-size:10.5px;font-weight:700;color:#eee7ff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill .cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,2,10,.72);
  font-weight:900;font-size:17px;color:#ffd9a0;backdrop-filter:blur(1px)}
.skill .cd.ready{display:none}
.skill.locked{opacity:.4;filter:grayscale(1)}
.skill.passive{border-style:dashed;border-color:rgba(150,200,255,.3)}
.skill .hot{position:absolute;top:2px;right:3px;font-size:9px;color:var(--gold-2)}

.log-panel{display:flex;flex-direction:column;height:480px;padding:10px}
.log-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:11.8px;line-height:1.45;padding-right:2px}
.log-list div{padding:2px 4px;border-radius:5px;color:#cfc8e2;border-left:2px solid transparent}
.log-list .l-sys{color:var(--gold-2);border-left-color:rgba(232,194,106,.5);background:rgba(232,194,106,.06)}
.log-list .l-ally{color:#c8f5dd;border-left-color:rgba(94,224,160,.4)}
.log-list .l-enemy{color:#ffc9c9;border-left-color:rgba(255,107,129,.45)}
.log-list .l-env{color:#cbb0ff;border-left-color:rgba(180,140,255,.5);background:rgba(150,110,255,.07)}
.log-list .l-boss{color:#ffb08a;border-left-color:rgba(255,140,90,.6);background:rgba(255,120,60,.07)}
.log-list .l-good{color:#ffe08a;border-left-color:rgba(255,215,120,.5)}

/* ---------- 5. 世界地图 ---------- */
.map-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.map-head h2{font-size:18px;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.map-track{display:flex;align-items:stretch;overflow-x:auto;padding:8px 4px 16px;gap:0}
.map-link{flex:0 0 40px;position:relative;align-self:center;height:2px;margin-bottom:44px;
  background-image:linear-gradient(90deg,rgba(232,194,106,.55) 50%,transparent 0);background-size:10px 2px;background-repeat:repeat-x}
.map-link.passed{background-image:linear-gradient(90deg,rgba(94,224,160,.8) 50%,transparent 0)}
.map-node{flex:0 0 122px;border-radius:14px;padding:10px 8px;cursor:pointer;position:relative;text-align:center;
  background:linear-gradient(170deg,rgba(40,30,66,.9),rgba(15,11,27,.94));
  border:1px solid var(--line);transition:.18s}
.map-node:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 26px rgba(232,194,106,.16)}
.map-node .mn-ico{font-size:30px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.map-node .mn-name{font-weight:800;font-size:12.5px;margin-top:3px}
.map-node .mn-stars{font-size:11px;color:#ffe08a;letter-spacing:1px}
.map-node .mn-prog{font-size:10.5px;color:var(--muted)}
.map-node .mn-pw{font-size:10.5px;color:#ffb3c8}
.map-node.locked{opacity:.5;filter:grayscale(.9);cursor:not-allowed}
.map-node.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.map-node.current::after{content:"";position:absolute;inset:-3px;border-radius:16px;border:1px solid rgba(232,194,106,.5);
  animation:glowPulse 2.2s infinite;pointer-events:none}
@keyframes glowPulse{0%,100%{opacity:.25}50%{opacity:.9}}
.map-node .lock-tip{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.25}

.hidden-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.hidden-card{padding:11px;border-radius:13px;border:1px solid rgba(180,140,255,.28);
  background:linear-gradient(160deg,rgba(52,32,82,.7),rgba(16,12,28,.9));cursor:pointer;transition:.18s}
.hidden-card:hover{transform:translateY(-3px);border-color:rgba(200,160,255,.6)}
.hidden-card.locked{opacity:.55;filter:grayscale(.7);cursor:not-allowed}
.hidden-card .hc-top{display:flex;align-items:center;gap:8px}
.hidden-card .hc-ico{font-size:24px}
.hidden-card .hc-name{font-weight:800;font-size:13px}
.hidden-card .hc-cond{font-size:11px;color:var(--muted);margin-top:4px}

.stage-head{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-bottom:12px}
.stage-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.stage-node{position:relative;padding:9px 6px;border-radius:12px;text-align:center;cursor:pointer;transition:.16s;
  background:linear-gradient(170deg,rgba(38,28,62,.85),rgba(14,10,26,.94));border:1px solid var(--line-2)}
.stage-node:hover{transform:translateY(-3px);border-color:var(--gold)}
.stage-node .sn-no{font-size:13px;font-weight:900;color:#efe8ff}
.stage-node .sn-stars{font-size:10.5px;color:#ffe08a;letter-spacing:.5px}
.stage-node .sn-mob{font-size:17px;line-height:1.2}
.stage-node.boss{grid-column:span 5;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;
  border-color:rgba(255,90,90,.45);background:linear-gradient(90deg,rgba(80,20,28,.55),rgba(20,10,18,.9));
  box-shadow:0 0 0 1px rgba(255,90,90,.15) inset;animation:bossBreathe 2.6s ease-in-out infinite}
@keyframes bossBreathe{0%,100%{box-shadow:0 0 12px rgba(255,60,60,.15) inset}50%{box-shadow:0 0 26px rgba(255,70,70,.35) inset}}
.stage-node.boss .sn-mob{font-size:30px}
.stage-node.boss .sn-name{font-size:15px;font-weight:900;color:#ffb0a8}
.stage-node.locked{opacity:.45;filter:grayscale(.85);cursor:not-allowed}
.stage-node.locked:hover{transform:none;border-color:var(--line-2)}
.stage-node.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(232,194,106,.2)}
.stage-node .sn-tag{position:absolute;top:-6px;right:-4px;font-size:10px;background:var(--gold);color:#241503;
  border-radius:6px;padding:0 4px;font-weight:800}

.affix-list{display:flex;flex-direction:column;gap:6px}
.affix-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line-2);transition:.15s}
.affix-row:hover{border-color:var(--gold)}
.affix-row.on{background:rgba(232,194,106,.1);border-color:rgba(232,194,106,.55)}
.affix-row .af-check{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;flex:0 0 auto}
.affix-row.on .af-check{background:var(--gold);color:#241503;border-color:var(--gold)}
.affix-row .af-name{font-weight:700;font-size:12.5px}
.affix-row .af-desc{font-size:11px;color:var(--muted)}
.affix-row .af-drop{margin-left:auto;font-size:11px;color:var(--ok);white-space:nowrap}

/* ---------- 6. 角色 / 背包 / 商店 / 锻造 / 宝箱 ---------- */
.char-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;align-items:start}
.hero-card{text-align:center;padding:16px 13px}
.hero-avatar{width:86px;height:86px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:44px;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.2),rgba(90,60,150,.35));
  border:2px solid rgba(232,194,106,.55);box-shadow:0 0 26px rgba(232,194,106,.28)}
.hero-name{font-size:17px;font-weight:900;color:var(--gold-2)}
.hero-role{font-size:11.5px;color:var(--muted)}
.stat-rows{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.stat-rows>div{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 9px;
  border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.03)}
.stat-rows b{color:#fff;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.2}
.point-box{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.point-row{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line-2)}
.point-row .pn{font-size:12px;color:var(--muted);flex:1}
.point-row .pv{font-size:12px;font-weight:800;color:var(--gold-2)}
.point-row button{width:22px;height:22px;border-radius:7px;background:rgba(232,194,106,.16);border:1px solid rgba(232,194,106,.4);color:var(--gold-2);font-weight:900;line-height:1}
.equip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skill-card{padding:9px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line-2)}
.skill-card.on{border-color:rgba(232,194,106,.45);background:rgba(232,194,106,.07)}
.skill-card .sc-top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px}
.skill-card .sc-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.skill-card .sc-cd{font-size:10.5px;color:var(--dim);margin-top:2px}

.bag-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.bag-tab{padding:6px 13px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);
  font-size:12.5px;color:var(--muted);transition:.15s}
.bag-tab.on{background:rgba(232,194,106,.14);border-color:rgba(232,194,106,.5);color:var(--gold-2);font-weight:700}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.item-tile{position:relative;padding:9px;border-radius:11px;cursor:pointer;transition:.15s;
  background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(0,0,0,.2));
  border:1px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.item-tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.4);border-color:var(--rc)}
.item-tile.equipped{box-shadow:0 0 0 1px var(--rc) inset}
.item-tile .it-top{display:flex;align-items:center;gap:6px}
.item-tile .it-ico{font-size:21px}
.item-tile .it-name{font-size:12px;font-weight:700;color:var(--rc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-tile .it-sub{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.item-tile .it-lock{position:absolute;top:5px;right:6px;font-size:11px}
.item-tile .it-badge{position:absolute;bottom:5px;right:6px;font-size:9.5px;color:var(--gold-2)}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mat-card{display:flex;align-items:center;gap:8px;padding:9px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line-2)}
.mat-card .mi{font-size:22px}
.mat-card .mn{font-size:12px;font-weight:700}
.mat-card .mc{margin-left:auto;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.shop-card{position:relative;padding:10px;border-radius:12px;background:linear-gradient(170deg,rgba(38,28,62,.8),rgba(14,10,26,.94));
  border:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;transition:.16s}
.shop-card:hover{border-color:var(--gold)}
.shop-card.bought{opacity:.45}
.shop-card .disc{position:absolute;top:-7px;right:6px;background:linear-gradient(180deg,#ff8f6b,#e0442f);color:#fff;
  font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;box-shadow:0 4px 10px rgba(224,68,47,.4)}
.shop-card .sc-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
.shop-card .sc-title .ico{font-size:20px}

.blueprint-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border-radius:12px;
  background:linear-gradient(170deg,rgba(40,30,64,.8),rgba(15,11,27,.92));border:1px solid var(--line-2)}
.blueprint-card .bp-ico{font-size:26px;text-align:center}
.blueprint-card .bp-name{font-weight:800;font-size:12.5px;color:var(--gold-2)}
.blueprint-card .bp-cost{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.blueprint-card .bp-cost .lack{color:var(--bad)}

.chest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.chest-card{padding:13px;border-radius:14px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(175deg,rgba(44,32,70,.9),rgba(14,10,26,.95));border:1px solid var(--line);
  transition:.18s}
.chest-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 30px rgba(232,194,106,.15)}
.chest-card .cc-ico{font-size:46px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));transition:.2s}
.chest-card:hover .cc-ico{transform:scale(1.08) rotate(-3deg)}
.chest-card .cc-name{font-weight:900;font-size:14px;margin-top:4px}
.chest-card .cc-desc{font-size:11px;color:var(--muted);min-height:30px;margin-top:2px}
.pity{font-size:10.5px;color:var(--dim);margin:6px 0}
.pity b{color:var(--gold-2)}

/* 开箱动画 */
.chest-stage{text-align:center;padding:12px 0 4px;position:relative;min-height:210px}
.chest-big{font-size:88px;display:inline-block;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));transition:.2s}
.chest-big.shake{animation:chestShake .55s ease-in-out infinite}
@keyframes chestShake{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}}
.chest-big.open{animation:chestOpen .5s ease forwards}
@keyframes chestOpen{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(6deg)}100%{transform:scale(1.05) rotate(0)}}
.beam{position:absolute;left:50%;top:-10%;width:220px;height:220px;transform:translateX(-50%);border-radius:50%;
  filter:blur(18px);opacity:0;transition:opacity .3s}
.beam.on{opacity:.85;animation:beamPulse 1.4s ease-in-out infinite}
@keyframes beamPulse{0%,100%{transform:translateX(-50%) scale(.9);opacity:.55}50%{transform:translateX(-50%) scale(1.08);opacity:.95}}
.reveal-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;text-align:left;margin-top:8px}
.reveal-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;opacity:0;transform:translateY(8px);
  animation:revealIn .3s ease forwards;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
@keyframes revealIn{to{opacity:1;transform:none}}

/* 设置 */
.setting-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.setting-row .sl{flex:1;font-size:13px}
.setting-row .sl small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.seg{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.seg button{padding:5px 11px;background:transparent;border:0;color:var(--muted);font-size:12px}
.seg button.on{background:rgba(232,194,106,.2);color:var(--gold-2);font-weight:700}
textarea{width:100%;min-height:88px;border-radius:10px;padding:8px;background:rgba(0,0,0,.35);
  border:1px solid var(--line-2);color:var(--text);font-size:11.5px;resize:vertical;font-family:ui-monospace,Consolas,monospace}

/* ---------- 7. 弹窗 / 提示 ---------- */
.modal-root{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;
  background:rgba(4,2,10,.72);backdrop-filter:blur(6px);animation:fadeIn .18s ease}
.modal-root[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(660px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:16px;
  background:linear-gradient(165deg,#241a3c,#120d22 70%);border:1px solid rgba(232,194,106,.45);
  box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset;animation:popIn .22s ease}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.modal-head h3{font-size:16px;color:var(--gold-2);flex:1}
.modal-close{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);font-size:14px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.toast-wrap{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;
  align-items:center;gap:7px;pointer-events:none;width:min(92vw,460px)}
.toast{padding:8px 15px;border-radius:11px;font-size:12.8px;font-weight:600;color:#fff;
  background:rgba(28,20,48,.96);border:1px solid rgba(232,194,106,.4);box-shadow:0 10px 26px rgba(0,0,0,.5);
  animation:toastIn .24s ease both;text-align:center;max-width:100%}
.toast.ok{border-color:rgba(94,224,160,.5);color:#c8f7dd}
.toast.bad{border-color:rgba(255,107,129,.5);color:#ffc4cc}
.toast.gold{border-color:rgba(232,194,106,.6);color:var(--gold-2)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}

.result-stars{font-size:34px;letter-spacing:8px;color:#ffe08a;text-align:center;margin:6px 0;
  text-shadow:0 0 20px rgba(255,215,120,.5)}
.star-line{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.star-line .yes{color:var(--ok)}
.star-line .no{color:var(--dim)}
.loot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-top:4px}
.loot-chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line-2);font-size:12px}
.loot-chip b{margin-left:auto;color:var(--gold-2)}

.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ---------- 8. 地图主题 ---------- */
.theme-forest{--tBg1:#061a10;--tBg2:#0b2a1b;--tGlow:#54e08a;--tLine:rgba(84,224,138,.3);--tAccent:#a7f3c8}
.theme-mine{--tBg1:#1a1008;--tBg2:#2c1d0d;--tGlow:#ffab4a;--tLine:rgba(255,171,74,.3);--tAccent:#ffd39b}
.theme-swamp{--tBg1:#101a12;--tBg2:#1d2b1d;--tGlow:#9ab86a;--tLine:rgba(154,184,106,.3);--tAccent:#d3e3a8}
.theme-ruins{--tBg1:#151020;--tBg2:#241a33;--tGlow:#b49cff;--tLine:rgba(180,156,255,.3);--tAccent:#d9ccff}
.theme-ice{--tBg1:#081826;--tBg2:#0f2c44;--tGlow:#6fd6ff;--tLine:rgba(111,214,255,.3);--tAccent:#bdefff}
.theme-desert{--tBg1:#241803;--tBg2:#3d2a08;--tGlow:#ffd166;--tLine:rgba(255,209,102,.32);--tAccent:#ffe9b0}
.theme-volcano{--tBg1:#22070a;--tBg2:#3d0e0b;--tGlow:#ff6b3d;--tLine:rgba(255,107,61,.35);--tAccent:#ffb08a}
.theme-abyss{--tBg1:#0a0614;--tBg2:#160a24;--tGlow:#a35cff;--tLine:rgba(163,92,255,.35);--tAccent:#cfaaff}
.theme-fairy{--tBg1:#1b0a1c;--tBg2:#32122f;--tGlow:#ff9bdc;--tLine:rgba(255,155,220,.32);--tAccent:#ffd0ef}
.theme-titan{--tBg1:#14140f;--tBg2:#2a2a1c;--tGlow:#c9b878;--tLine:rgba(201,184,120,.3);--tAccent:#e8dfb4}
.theme-rift{--tBg1:#05141a;--tBg2:#0f2030;--tGlow:#63e6d9;--tLine:rgba(99,230,217,.32);--tAccent:#b6f5ee}

.theme-forest .arena{background:
  radial-gradient(75% 55% at 18% 8%,rgba(84,224,138,.20),transparent 62%),
  radial-gradient(60% 45% at 84% 18%,rgba(30,120,70,.34),transparent 66%),
  linear-gradient(180deg,#04120b 0%,#0a2a1a 52%,#061a11 100%)}
.theme-forest .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(60% 40% at 8% 100%,rgba(5,40,24,.95),transparent 70%),
    radial-gradient(50% 34% at 46% 104%,rgba(4,34,20,.9),transparent 70%),
    radial-gradient(52% 38% at 92% 102%,rgba(5,40,24,.95),transparent 70%)}

.theme-mine .arena{background:
  radial-gradient(45% 40% at 82% 6%,rgba(255,171,74,.28),transparent 62%),
  radial-gradient(70% 60% at 20% 90%,rgba(80,50,20,.6),transparent 70%),
  linear-gradient(180deg,#120c06 0%,#241708 55%,#180f06 100%)}
.theme-mine .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,171,74,.07) 26px 28px),
    radial-gradient(20% 30% at 12% 0%,rgba(60,40,20,.9),transparent 70%)}

.theme-swamp .arena{background:
  radial-gradient(80% 40% at 50% 92%,rgba(120,150,80,.20),transparent 70%),
  linear-gradient(180deg,#0b1410 0%,#1b2a1c 50%,#101a14 100%)}
.theme-swamp .arena::before{content:"";position:absolute;left:-10%;right:-10%;top:22%;height:46%;pointer-events:none;
  background:radial-gradient(45% 60% at 30% 50%,rgba(190,210,170,.16),transparent 70%),
    radial-gradient(40% 50% at 70% 45%,rgba(160,190,150,.14),transparent 70%);
  filter:blur(8px);animation:swampFog 14s ease-in-out infinite alternate}
@keyframes swampFog{from{transform:translateX(-4%)}to{transform:translateX(5%)}}

.theme-ruins .arena{background:
  radial-gradient(60% 50% at 50% 0%,rgba(180,156,255,.18),transparent 66%),
  linear-gradient(180deg,#0c0914 0%,#1d152c 55%,#100b1a 100%)}
.theme-ruins .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 14px,transparent 14px 62px);
  mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}

.theme-ice .arena{background:
  radial-gradient(60% 50% at 24% 4%,rgba(111,214,255,.26),transparent 64%),
  radial-gradient(60% 60% at 88% 96%,rgba(60,150,200,.28),transparent 70%),
  linear-gradient(180deg,#06121e 0%,#0d2b42 55%,#081a2b 100%)}
.theme-ice .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(118deg,transparent 44%,rgba(190,240,255,.18) 46%,transparent 48%),
    linear-gradient(72deg,transparent 60%,rgba(190,240,255,.12) 62%,transparent 64%)}

.theme-desert .arena{background:
  radial-gradient(30% 26% at 76% 16%,rgba(255,235,160,.5),transparent 62%),
  radial-gradient(120% 40% at 50% 100%,rgba(180,130,40,.45),transparent 72%),
  linear-gradient(180deg,#2a1c06 0%,#4a330c 48%,#2b1d07 100%)}
.theme-desert .arena::before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
  background:radial-gradient(60% 100% at 20% 100%,rgba(230,180,80,.35),transparent 70%),
    radial-gradient(60% 100% at 80% 100%,rgba(210,160,70,.3),transparent 70%)}

.theme-volcano .arena{background:
  radial-gradient(70% 40% at 50% 106%,rgba(255,90,30,.55),transparent 64%),
  radial-gradient(50% 40% at 16% 10%,rgba(255,90,40,.2),transparent 66%),
  linear-gradient(180deg,#180406 0%,#3a0c08 52%,#1c0505 100%)}
.theme-volcano .arena::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,110,20,.45),transparent);animation:lavaGlow 3.4s ease-in-out infinite alternate}
@keyframes lavaGlow{from{opacity:.5}to{opacity:1}}
.theme-volcano .arena::after{content:"";position:absolute;inset:0;pointer-events:none;

    radial-gradient(3px 3px at 84% 58%,rgba(255,190,90,.7),transparent);
  animation:emberRise 6s linear infinite}
@keyframes emberRise{from{transform:translateY(18px);opacity:.9}to{transform:translateY(-40px);opacity:.15}}

.theme-abyss .arena{background:
  radial-gradient(40% 34% at 50% 26%,rgba(163,92,255,.22),transparent 64%),

.theme-abyss .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(2px 2px at 18% 30%,#c9a4ff,transparent),radial-gradient(2px 2px at 74% 64%,#9c6bff,transparent),
    radial-gradient(2px 2px at 46% 80%,#d8b8ff,transparent);animation:abyssTwinkle 4s ease-in-out infinite alternate}
@keyframes abyssTwinkle{from{opacity:.2}to{opacity:.6}}

.theme-fairy .arena{background:
  radial-gradient(50% 44% at 22% 12%,rgba(255,155,220,.3),transparent 66%),
  radial-gradient(50% 40% at 80% 22%,rgba(180,130,255,.26),transparent 66%),
  linear-gradient(180deg,#1a0718 0%,#331130 55%,#1a0718 100%)}
.theme-fairy .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(3px 3px at 24% 34%,rgba(255,220,245,.9),transparent),
    radial-gradient(2px 2px at 62% 18%,rgba(255,190,235,.9),transparent),radial-gradient(3px 3px at 84% 62%,rgba(255,230,250,.8),transparent)}

.theme-titan .arena{background:

.theme-titan .arena::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;

.theme-rift .arena{background:

.theme-rift .arena::before{content:"";position:absolute;inset:-40%;pointer-events:none;opacity:.35;

/* ---------- 9. 响应式 ---------- */
@media (max-width:1100px){
  .battle-layout{grid-template-columns:minmax(0,1fr) 280px}
  .stage-panel{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .log-panel{height:340px}
}
@media (max-width:900px){
  .battle-layout{display:flex;flex-direction:column;gap:10px}
  .battle-layout>.stage-panel{order:1}
  .battle-layout>section{order:2;min-width:0}
  .battle-layout.in-battle>section{order:1}
  .battle-layout.in-battle>.stage-panel{order:3}
  .battle-layout>.log-panel{order:4;height:220px}
  .char-layout{grid-template-columns:1fr}
  .stage-head{grid-template-columns:1fr}
  .stage-panel{grid-template-columns:1fr}
  .hidden-row{grid-template-columns:1fr}
  .stage-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stat-rows{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{font-size:13.5px}
  .topbar{padding:6px 8px;gap:6px;flex-wrap:nowrap}
  .brand{display:none}
  .brand-txt{display:none}
  .resbar{margin-left:0;flex:1;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none;padding-bottom:1px}
  .resbar::-webkit-scrollbar{display:none}
  .chip{padding:3px 7px;font-size:11.5px}
  .chip.star{display:none}
  .icon-btn{width:30px;height:30px;flex:0 0 auto}
  .screens{padding:10px 8px 88px}
  .arena{min-height:280px;grid-template-columns:1fr 34px 1fr;padding:12px 6px 38px}
  .unit{width:74px}
  .unit.boss{width:92px}
  .unit .avatar{font-size:30px}
  .unit.boss .avatar{font-size:40px}
  .unit .uname{font-size:10px}
  .skill{width:calc(25% - 6px);min-width:64px}
  .stage-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage-node.boss{grid-column:span 3}
  .stat-rows{grid-template-columns:repeat(2,minmax(0,1fr))}
  .equip-grid,.skill-list,.point-box{grid-template-columns:1fr}
  .bag-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tab{flex:1 1 0;padding:5px 2px}
  .tab i{font-size:17px}
  .tab span{font-size:9.5px}
  .map-node{flex:0 0 104px}
  .log-panel{height:190px}
  .modal{padding:12px;border-radius:14px;max-height:92vh}
  .toast-wrap{bottom:82px}
}
@media (max-width:380px){
  .stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage-node.boss{grid-column:span 2}
}

/* 关闭动效 */
.no-fx .starbg,.no-fx .arena::before,.no-fx .arena::after{animation:none!important}
.no-fx .float{animation-duration:.5s}

/* ---------- 2.6 战斗：环境与 Boss 机制 ---------- */
function eff(u, stat) {

}

}

  b.units.forEach(u => {
    if (!u.alive || !u.isBoss || u.enraged) return;
    if (u.hp > 0 && u.hp <= u.maxHp * 0.3) {
      u.enraged = true;
      pushLog(ev, `${u.name} 的生命降至 30%，进入狂暴状态！`, 'l-boss');
      const hook = BOSS_HOOKS[u.bossId];
      if (hook && hook.enrage) hook.enrage(b, u, ev);
    }
  });
}
function checkDeaths(b, ev) {
  b.units.forEach(u => {
    if (!u.alive || u.hp > 0) return;
    if (u.isBoss && BOSS_HOOKS[u.bossId] && BOSS_HOOKS[u.bossId].onDeath) {
      BOSS_HOOKS[u.bossId].onDeath(b, u, ev);
      if (u.hp > 0) { u.alive = true; return; }
    }
    u.alive = false;
    u.poison = null;
    u.buffs = [];
    pushLog(ev, `${u.name} 被击败！`, u.side === 'enemy' ? 'l-ally' : 'l-enemy');
    if (u.side === 'enemy') {
      b.flags.kills = (b.flags.kills || 0) + 1;
      if (u.isElite) b.eliteKills = (b.eliteKills || 0) + 1;
      if (u.isBoss) b.flags.bossKilled = true;
    }
  });
  /* 首领受伤触发反伤等 */
}
function checkEnd(b, ev) {
  if (b.finished) return;
  const p = b.units.find(u => u.isPlayer);
  if (!p || !p.alive) {
    b.finished = true; b.win = false;
    pushLog(ev, '你倒下了…… 战斗失败（战前状态完全保留，可立即重试）', 'l-sys');
    b.hpPct = 0;
    return;
  }
  if (enemiesAlive(b).length === 0 && b.wave >= b.waveCount - 1) {
    b.finished = true; b.win = true;
    b.hpPct = p.hp / p.maxHp;
    pushLog(ev, '战斗胜利！', 'l-sys');
  }
}
function battleStep(b, choice) {
  const ev = [];
  if (b.finished) return { events: ev, done: true };
  if (b.round > 200) {
    b.finished = true; b.win = false;
    pushLog(ev, '战斗超时，判定失败', 'l-sys');
    return { events: ev, done: true };
  }
  if (b.needRound) {
    startRound(b, ev);
    if (b.finished) return { events: ev, done: true };
    checkBossEnrage(b, ev);
  }
  let actor = null;
  while (b.queue.length) {
    const u = b.units.find(x => x.uid === b.queue[0]);
    if (!u || !u.alive) { b.queue.shift(); continue; }
    if (u.stun > 0) {
      b.queue.shift();
      u.stun--;
      pushLog(ev, `${u.name} 被眩晕，跳过行动`, 'l-env');
      continue;
    }
    actor = u;
    break;
  }
  if (!actor) {
    endRound(b, ev);
    return { events: ev, done: b.finished };
  }
  if (actor.isPlayer && b.manual && choice === undefined) {
    b.waiting = true;
    b.pendingSkill = null;
    return { events: ev, waiting: true, done: false };
  }
  b.waiting = false;
  b.queue.shift();
  if (actor.isPlayer) doPlayerAction(b, actor, choice, ev);
  else doEnemyAction(b, actor, ev);
  checkBossEnrage(b, ev);
  /* 反伤 / 环境造成的死亡 */
  checkDeaths(b, ev);
  if (!b.finished) {
    if (enemiesAlive(b).length === 0 && b.wave < b.waveCount - 1) {
      spawnWave(b);
      const p = b.units.find(u => u.isPlayer);
      if (p && p.alive) healUnit(b, p, p.maxHp * BALANCE.waves.healBetween, ev, '整备');
      pushLog(ev, `第 ${b.wave + 1} / ${b.waveCount} 波敌人出现！`, 'l-sys');
      b.needRound = true;
    }
    checkEnd(b, ev);
  }
  return { events: ev, done: b.finished };
}

/* ---------- 2.10 结算与掉落 ---------- */
function calcStars(win, rounds, targetRounds, hpPct) {
  if (!win) return 0;
  let s = 1;
  if (rounds <= targetRounds) s++;
  if (hpPct >= BALANCE.mech.starHpThreshold) s++;
  return Math.min(3, s);
}
function computeRewards(b, extra) {
  const stage = getStage(b.stageNo);
  const map = getMap(b.mapId);
  const e = extra || {};
  const dropSum = (b.affixes || []).reduce((a, id) => a + (AFFIXES[id] ? AFFIXES[id].drop : 0), 0);
  const goldMod = (b.mods.gold || 1);
  const gold = Math.round(BALANCE.gold.stageBase * Math.pow(BALANCE.gold.stageG, b.stageNo - 1) *
    (stage.isBoss ? BALANCE.gold.bossMult : 1) * goldMod * (1 + dropSum * 0.35));
  const exp = Math.round(BALANCE.exp.stageBase * Math.pow(BALANCE.exp.stageG, b.stageNo - 1) *
    (stage.isBoss ? BALANCE.exp.bossMult : 1));
  const mats = {};
  const addMat = (id, n) => { if (id && n > 0) mats[id] = (mats[id] || 0) + n; };
  addMat(map.mats.common, rint(BALANCE.drop.matMin, BALANCE.drop.matMax) + (stage.isBoss ? 2 : 0));
  if (stage.isBoss || Math.random() < BALANCE.drop.matRareChance) addMat(map.mats.rare, stage.isBoss ? rint(1, 2) : 1);
  if (stage.isBoss) addMat(map.mats.boss, 1);
  addMat('stone', rint(0, 2) + (stage.isBoss ? 2 : 0));
  if (stage.isBoss && e.firstClear) addMat('ticket', 1);

  const items = [];
  const equipChance = (stage.isBoss ? BALANCE.drop.equipBoss : BALANCE.drop.equipNormal) * (b.mods.equipDrop || 1) * (1 + dropSum * 0.4);
  let equipCount = 0;
  if (Math.random() < equipChance) equipCount++;
  if (stage.isBoss) equipCount++;
  equipCount += (e.eliteKills || 0);
  const minRarity = stage.isBoss ? 2 : 0;
  for (let i = 0; i < equipCount; i++) {
    items.push(rollEquipment({ ilvl: b.stageNo, minRarity, luck: map.idx * 0.3, special: e.specialId || null }));
  }
  /* 首通 Boss 必掉一件紫色以上装备 */
  if (stage.isBoss && e.firstClear) {
    items.push(rollEquipment({ ilvl: b.stageNo, minRarity: 3, maxRarity: 5, luck: map.idx * 0.3 }));
  }
  /* 隐藏地图 Boss 必掉神话装备 */
  if (stage.isBoss && map.hidden) {
    items.push(rollEquipment({ ilvl: b.stageNo, rarity: 5, special: map.id }));
  }
  let blueprint = null;
  const bps = Object.keys(BLUEPRINTS).filter(id => BLUEPRINTS[id].map === map.id);
  if (stage.isBoss && e.firstClear && bps.length) blueprint = pickOne(bps);
  else if (Math.random() < BALANCE.drop.blueNormal && bps.length) blueprint = pickOne(bps);

  const gems = stage.isBoss ? (e.firstClear ? 25 : 4) : 0;
  return { gold, exp, gems, mats, items, blueprint, dropSum };
}

function shopEquipmentPrice(item) {
  const r = RARITY_BY_ID[item.rarity];
  return Math.round(60 * Math.pow(1.11, item.ilvl) * (0.55 + r.mult * 0.65));
}
function rollShop(level, ilvl) {
  const items = [];
  /* 2 个消耗品 */
  items.push({ kind: 'cons', id: 'potion', count: 3, price: 360, currency: 'gold', icon: '🧴', name: '生命药水 ×3', desc: '战斗中回复 30% 最大生命' });
  items.push({ kind: 'cons', id: 'stone', count: 5, price: 420, currency: 'gold', icon: '🔧', name: '强化石 ×5', desc: '装备强化材料' });
  /* 2 个材料包 */
  const pool = MAPS.filter(m => !m.hidden);
  const m1 = pool[clamp(Math.floor((ilvl - 1) / 10), 0, pool.length - 1)];
  const m2 = pool[clamp(Math.floor((ilvl - 1) / 10) - 2, 0, pool.length - 1)];
  items.push({ kind: 'mat', id: m1.mats.common, count: 8, price: 900, currency: 'gold', icon: MATERIALS[m1.mats.common].icon, name: MATERIALS[m1.mats.common].name + ' ×8', desc: '来自' + m1.name });
  items.push({ kind: 'mat', id: m2.mats.rare, count: 2, price: 30, currency: 'gems', icon: MATERIALS[m2.mats.rare].icon, name: MATERIALS[m2.mats.rare].name + ' ×2', desc: '稀有材料' });
  /* 2 件随机装备 */
  const luck = 0.4 + level * 0.02;
  for (let i = 0; i < 2; i++) {
    const eq = rollEquipment({ ilvl: Math.max(1, ilvl), minRarity: 1, maxRarity: 4, luck, boosts: false });
    eq.uid = null;
    items.push({ kind: 'equip', item: eq, price: shopEquipmentPrice(eq), currency: 'gold', icon: eq.icon, name: eq.name, desc: RARITY_BY_ID[eq.rarity].name + ' · iLv ' + eq.ilvl });
  }
  const discountIdx = Math.floor(Math.random() * items.length);
  items.forEach((it, i) => {
    it.sold = false;
    it.discount = i === discountIdx;
    it.finalPrice = it.discount ? Math.round(it.price * BALANCE.shop.discount) : it.price;
  });
  return items;
}
function rollChest(chestId, ilvl, count, pity) {
  const cfg = CHESTS[chestId];
  const out = { items: [], mats: {}, gold: 0, pity: pity || 0, best: 0 };
  for (let i = 0; i < count; i++) {
    out.pity++;
    let rarity;
    if (out.pity >= cfg.pity) {
      rarity = clamp(cfg.pityRare, cfg.rMin, cfg.rMax);
      out.pity = 0;
    } else {
      rarity = rollRarity(cfg.rMin, cfg.rMax, 0.5);
      if (rarity >= cfg.pityRare) out.pity = 0;
    }
    const slot = pickOne(SLOT_ORDER);
    const eq = rollEquipment({ slot, ilvl, rarity, boosts: false });
    out.items.push(eq);
    if (rarity > out.best) out.best = rarity;
    if (chestId === 'copper' || chestId === 'silver') {
      out.mats.stone = (out.mats.stone || 0) + rint(1, 2);
    } else {
      out.mats.stone = (out.mats.stone || 0) + rint(3, 6);
    }
    const matPool = MAPS.filter(m => m.mats.rare && m.id !== 'forest');
    const matMap = pickOne(matPool);
    const matId = Math.random() < 0.7 ? matMap.mats.common : matMap.mats.rare;
    out.mats[matId] = (out.mats[matId] || 0) + rint(1, 3);
    if (chestId === 'silver') out.gold += rint(400, 900);
    if (chestId === 'gold' || chestId === 'dragon') out.gold += rint(1500, 3200);
  }
  return out;
}

function todayKey() {

}
function saveGame() {
  if (!state) return;

    state.savedAt = Date.now();

  } catch (e) {
    console.warn('保存失败', e);

}
function loadGame() {
  let raw = null;
  try { raw = localStorage.getItem(BALANCE.saveKey); } catch (e) { raw = null; }
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object' || !s.classId || !CLASSES[s.classId]) return null;

function migrateSave(s) {
  const d = defaultState(s.classId);
  const out = Object.assign(d, s);
  out.points = Object.assign({ hp: 0, atk: 0, def: 0, spd: 0 }, s.points || {});
  out.settings = Object.assign(d.settings, s.settings || {});
  out.chestPity = Object.assign(d.chestPity, s.chestPity || {});
  out.cons = Object.assign({ stone: 0, potion: 0, ticket: 0 }, s.cons || {});
  out.mats = s.mats || {};
  out.inv = Array.isArray(s.inv) ? s.inv.filter(it => it && SLOTS[it.slot] && RARITY_BY_ID[it.rarity]) : [];
  out.equipped = s.equipped || {};
  out.stars = s.stars || {};
  out.starClaims = s.starClaims || {};
  out.affixes = s.affixes || {};
  out.blueprints = s.blueprints || {};
  out.uidSeq = Math.max(1, s.uidSeq || 1);
  out.level = Math.max(1, Math.round(s.level || 1));
  out.exp = Math.max(0, s.exp || 0);
  out.freePoints = Math.max(0, Math.round(s.freePoints || 0));
  ['gold', 'gems', 'dust', 'bagSize'].forEach(k => { out[k] = Math.max(0, Math.round(s[k] || d[k] || 0)); });
  out.current = s.current && STAGE_BY_NO[s.current.stageNo] ? s.current : d.current;
  return out;
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(str) {
  const bin = atob(str.replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportSave() { return state ? b64encode(JSON.stringify(state)) : ''; }
function importSave(code) {
  try {
    const s = JSON.parse(b64decode(code));
    if (!s || !s.classId || !CLASSES[s.classId]) throw new Error('格式错误');
    state = migrateSave(s);
    saveGame();
    renderAll();
    toast('存档导入成功！', 'ok');
    return true;
  } catch (e) {
    toast('导入失败：存档码格式不正确', 'bad');
    return false;
  }
}

function addGold(n) { state.gold = Math.max(0, state.gold + Math.round(n)); }
function addGems(n) { state.gems = Math.max(0, state.gems + Math.round(n)); }
function addDust(n) { state.dust = Math.max(0, state.dust + Math.round(n)); }
function addMat(id, n) {
  if (!id || !n) return;
  if (MATERIALS[id] && MATERIALS[id].tier === 'cons') {
    state.cons[id] = (state.cons[id] || 0) + n;
  } else {
    state.mats[id] = (state.mats[id] || 0) + n;
  }
}
function matCount(id) {
  if (MATERIALS[id] && MATERIALS[id].tier === 'cons') return state.cons[id] || 0;
  return state.mats[id] || 0;
}
function addExp(n) {
  if (n <= 0) return 0;
  state.exp += n;
  let ups = 0;
  let guard = 0;
  while (state.exp >= expNeed(state.level) && guard++ < 500) {
    state.exp -= expNeed(state.level);
    state.level++;
    state.freePoints += BALANCE.points.perLevel;
    ups++;
  }
  if (ups > 0) {
    playSfx('up');
    levelUpFx();
    const cls = CLASSES[state.classId];
    const unlocked = cls.skills.filter(id => SKILLS[id].unlock > state.level - ups && SKILLS[id].unlock <= state.level && SKILLS[id].kind !== 'passive');
    toast(`升级！Lv.${state.level}，获得 ${ups * BALANCE.points.perLevel} 属性点`, 'gold');
    unlocked.forEach(id => setTimeout(() => toast(`解锁技能：${SKILLS[id].name}`, 'gold'), 500));
  }
  return ups;
}

  if (!item.affixes || !item.affixes.length) return toast('这件装备没有可重铸的词条', 'bad');

  if (state.dust < cost) return toast('魔尘不足，需要 ' + fmt(cost), 'bad');
  addDust(-cost);
  reforgeAffixes(item, lockId || null);
  saveGame();
  toast('重铸完成，新的词条已生成', 'ok');
  playSfx('up');
  openItemModal(uid);
  renderAll();
}
function sellTrash() {
  const targets = state.inv.filter(it => (it.rarity === 0 || it.rarity === 1) && !it.locked && state.equipped[it.slot] !== it.uid);
  if (!targets.length) return toast('没有可出售的普通 / 优秀装备', '');
  const gain = targets.reduce((a, it) => a + itemSellPrice(it), 0);
  targets.forEach(it => { state.inv = state.inv.filter(x => x.uid !== it.uid); });
  addGold(gain);
  saveGame();
  renderAll();
  toast(`已出售 ${targets.length} 件装备，获得 ${fmt(gain)} 金币`, 'ok');
  playSfx('coin');
}

/* ---------- 3.5 等级 / 加点 ---------- */
function addPoint(stat) {
  if (state.freePoints <= 0) return toast('没有可分配的属性点', '');
  if (!state.points[stat] && state.points[stat] !== 0) return;
  state.points[stat] = (state.points[stat] || 0) + 1;
  state.freePoints--;
  saveGame();
  renderAll();
}
function autoPoints() {
  if (state.freePoints <= 0) return toast('没有可分配的属性点', '');
  const w = CLASSES[state.classId].weights;
  const order = ['hp', 'atk', 'def', 'spd'].filter(k => w[k] > 0);
  if (!order.length) order.push('atk');
  let guard = 0;
  while (state.freePoints > 0 && guard++ < 1000) {
    let pool = [];
    order.forEach(k => { for (let i = 0; i < w[k]; i++) pool.push(k); });
    const k = pickOne(pool);
    state.points[k] = (state.points[k] || 0) + 1;
    state.freePoints--;
  }
  saveGame();
  renderAll();
  toast('已按职业推荐完成加点', 'ok');
}
function resetPoints() {
  const total = state.points.hp + state.points.atk + state.points.def + state.points.spd;
  if (total <= 0) return toast('还没有分配过属性点', '');
  const cost = 20;
  if (state.gems < cost) return toast('重置需要 ' + cost + ' 钻石', 'bad');
  state.gems -= cost;
  state.freePoints += total;
  state.points = { hp: 0, atk: 0, def: 0, spd: 0 };
  saveGame();
  renderAll();
  toast('属性点已重置', 'ok');
}

/* ---------- 3.6 地图进度 ---------- */
function mapStars(mapId) {
  const o = state.stars[mapId] || {};
  return Object.keys(o).reduce((a, k) => a + (o[k] || 0), 0);
}
function stageStars(no) {
  const st = getStage(no);
  const o = state.stars[st.map] || {};
  return o[st.index] || 0;
}
function mainStars() {
  return MAPS.filter(m => !m.hidden).reduce((a, m) => a + mapStars(m.id), 0);
}
function allStars() {
  return MAPS.reduce((a, m) => a + mapStars(m.id), 0);
}
function mapCleared(map) {
  return stageStars(map.startStage + 9) > 0;
}
function mapUnlocked(map) {
  const u = map.unlock;
  if (u.type === 'start') return true;
  if (u.type === 'stage') {
    const target = MAPS.find(m => m.id === u.map);
    return !!target && stageStars(target.startStage + u.stage - 1) > 0;
  }
  if (u.type === 'stars') return mainStars() >= u.count;
  return false;
}
function mapUnlockText(map) {
  const u = map.unlock;
  if (u.type === 'start') return '初始地图';
  if (u.type === 'stage') {
    const target = MAPS.find(m => m.id === u.map);
    return '通关「' + (target ? target.name : u.map) + '」第 ' + u.stage + ' 关';
  }
  if (u.type === 'stars') return '累计获得 ' + u.count + ' 颗星（当前 ' + mainStars() + '）';
  return '未知条件';
}
function stageUnlocked(stage) {
  const map = getMap(stage.map);
  if (!mapUnlocked(map)) return { ok: false, reason: '地图未解锁：' + mapUnlockText(map) };
  if (stage.index === 1) return { ok: true };
  if (stage.index === 10) {
    for (let i = 1; i <= 9; i++) {
      if (stageStars(stage.no - 10 + i) <= 0) return { ok: false, reason: '需要先通关本图第 1~9 关' };
    }
    return { ok: true };
  }
  if (stageStars(stage.no - 1) <= 0) return { ok: false, reason: '需要先通关第 ' + (stage.index - 1) + ' 关' };
  return { ok: true };
}
function highestCleared() {
  let best = 1;
  STAGES.forEach(s => { if (stageStars(s.no) > 0 && s.no > best) best = s.no; });
  return best;
}
function nextStageNo(stage) {
  return STAGE_BY_NO[stage.no + 1] ? stage.no + 1 : null;
}
function selectStage(no) {
  const st = getStage(no);
  if (!st) return;
  /* 放弃暂停中的旧战斗，避免卡在旧关卡 */
  if (ui.battle && !ui.battle.finished) {
    clearTimeout(ui.timer);
    ui.battle = null;
    ui.paused = false;
    ui.resultShown = false;
  }
  state.current = { mapId: st.map, stageNo: st.no };
  saveGame();
  ui.tab = 'battle';
  ui.openMap = st.map;
  renderAll();
}
function toggleAffix(mapId, id) {
  const list = state.affixes[mapId] || [];
  if (list.indexOf(id) >= 0) state.affixes[mapId] = list.filter(x => x !== id);
  else if (list.length < 3) state.affixes[mapId] = list.concat(id);
  else return toast('最多选择 3 条词缀', 'bad');
  saveGame();
  openAffixModal(mapId);
}
function claimStarReward(mapId, threshold) {
  const claimed = state.starClaims[mapId] || [];
  if (mapStars(mapId) < threshold) return toast('星数不足', 'bad');
  if (claimed.indexOf(threshold) >= 0) return toast('该奖励已领取', '');
  state.starClaims[mapId] = claimed.concat(threshold);
  addGold(BALANCE.starReward.gold * threshold / 10);
  addGems(BALANCE.starReward.gems * threshold / 10);
  addDust(BALANCE.starReward.dust * threshold / 10);
  addMat(getMap(mapId).mats.common, 10);
  addMat(getMap(mapId).mats.rare, 3);
  saveGame();
  renderAll();
  toast(`星数奖励（${threshold} 星）已领取`, 'gold');
  playSfx('up');
}

/* ---------- 3.7 战斗 ---------- */
function startBattle(stageNo, opts) {
  if (!state || !state.classId) return;
  const stage = getStage(stageNo);
  const unlock = stageUnlocked(stage);
  if (!unlock.ok) return toast(unlock.reason, 'bad');
  clearTimeout(ui.timer);
  clearTimeout(ui.chainTimer);
  ui.battle = null;
  const cls = CLASSES[state.classId];
  const stats = playerStats();
  const player = buildPlayerUnit(stats, cls, state.level);
  const b = createBattle({
    mapId: stage.map, stageNo: stage.no, player,
    affixes: state.affixes[stage.map] || [],
    manual: !!state.settings.manual
  });
  ui.battle = b;
  ui.paused = false;
  ui.waitingSkill = false;
  ui.resultShown = false;
  state.stats.battles++;
  state.current = { mapId: stage.map, stageNo: stage.no };
  saveGame();
  switchTab('battle', true);
  scheduleTick(160);
}
function scheduleTick(delay) {
  clearTimeout(ui.timer);
  if (!ui.battle || ui.battle.finished || ui.paused) return;
  const speed = Math.max(1, state.settings.speed || 1);
  const d = delay == null ? Math.round(BALANCE.battle.baseDelay / speed) : delay;
  ui.timer = setTimeout(() => battleTick(), d);
}
function battleTick(choice) {
  const b = ui.battle;
  if (!b || b.finished) return;
  if (ui.paused && choice === undefined) return;
  let res;
  try {
    res = battleStep(b, choice);
  } catch (err) {
    console.error(err);
    toast('战斗出现异常，已结束本场', 'bad');
    b.finished = true; b.win = false;
    finishBattle();
    return;
  }
  applyBattleEvents(res.events);
  syncBattle();
  if (res.waiting) {
    ui.waitingSkill = true;
    syncBattle();
    return;
  }
  ui.waitingSkill = false;
  if (b.finished) { finishBattle(); return; }
  scheduleTick();
}
function applyBattleEvents(events) {
  if (!events || !events.length) return;
  const arena = document.getElementById('arena');
  events.forEach(e => {
    if (e.k === 'log') appendBattleLog(e.text, e.cls);
    else if (e.k === 'fx' && arena) floatNumber(e, arena);
  });
}
function appendBattleLog(text, cls) {
  if (ui.battle) {
    ui.battle.logs = ui.battle.logs || [];
    ui.battle.logs.push({ text, cls: cls || '' });
    if (ui.battle.logs.length > 220) ui.battle.logs.shift();
  }
  const list = document.getElementById('battle-log');
  if (!list) return;
  const div = document.createElement('div');
  div.className = cls || '';
  div.innerHTML = text;
  list.appendChild(div);
  while (list.children.length > 160) list.removeChild(list.firstChild);
  list.scrollTop = list.scrollHeight;
}
function floatNumber(e, arena) {
  const unitEl = arena.querySelector('.unit[data-uid="' + e.uid + '"]');
  if (!unitEl) return;
  if (e.miss) {
    if (e.label) {
      const s = document.createElement('span');
      s.className = 'float miss';
      s.textContent = e.label;
      unitEl.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
    return;
  }
  const span = document.createElement('span');
  let text = (e.heal ? '+' : '-') + fmt(e.v);
  if (e.crit) text += ' 暴击!';
  span.className = 'float ' + (e.heal ? 'heal' : e.env ? 'env' : e.crit ? 'crit' : 'dmg');
  span.textContent = text;
  unitEl.appendChild(span);
  setTimeout(() => span.remove(), 950);
  if (e.crit && arena) {
    arena.classList.remove('shake');
    void arena.offsetWidth;
    arena.classList.add('shake');
    setTimeout(() => arena.classList.remove('shake'), 300);
    playSfx('crit');
  } else if (!e.heal) {
    playSfx('hit');
  }
  const avatar = unitEl.querySelector('.avatar');
  if (avatar && !e.heal) {
    unitEl.classList.remove('hit');
    void unitEl.offsetWidth;
    unitEl.classList.add('hit');
    setTimeout(() => unitEl.classList.remove('hit'), 320);
  }
}
function finishBattle() {
  if (ui.resultShown) return;
  ui.resultShown = true;
  clearTimeout(ui.timer);
  const b = ui.battle;
  if (!b) return;
  if (b.win) winBattle(b);
  else loseBattle(b);
}
function winBattle(b) {
  const stage = getStage(b.stageNo);
  const map = getMap(b.mapId);
  const prevStars = stageStars(stage.no);
  const firstClear = prevStars === 0;
  const stars = calcStars(true, b.round, stage.targetRounds, b.hpPct);
  const rewards = computeRewards(b, { firstClear, eliteKills: b.eliteKills || 0 });
  const rewardSum = grantRewards(rewards, b);
  state.stars[stage.map] = state.stars[stage.map] || {};
  if (stars > (state.stars[stage.map][stage.index] || 0)) state.stars[stage.map][stage.index] = stars;
  state.stats.wins++;
  state.stats.kills += (b.flags.kills || 0);
  saveGame();
  const unlockedMaps = [];
  MAPS.forEach(m => {
    if (m.unlock.type === 'stage' && m.unlock.map === map.id && m.unlock.stage === stage.index && stage.index === 10 && mapUnlocked(m)) {
      if (!m.hidden || true) unlockedMaps.push(m.name);
    }
  });
  playSfx('win');
  renderAll();
  showResultModal(b, stage, stars, prevStars, rewards, rewardSum, firstClear, unlockedMaps);
}
function loseBattle(b) {

  renderAll();

    <div class="modal-head"><h3>战斗失败</h3><button class="modal-close" data-close="1">✕</button></div>

}
function tipsForMap(map) {

function grantRewards(rewards, b) {

  Object.keys(rewards.mats || {}).forEach(id => addMat(id, rewards.mats[id]));

/* ---------- 3.8 扫荡 ---------- */
function ensureSweep() {
  const today = todayKey();
  if (!state.sweep || state.sweep.date !== today) state.sweep = { date: today, used: 0 };
  return state.sweep;
}
function freeSweepsLeft() {
  const s = ensureSweep();
  return Math.max(0, BALANCE.sweep.daily - s.used);
}
function sweepStage(no) {
  const stage = getStage(no);
  if (stageStars(no) <= 0) return toast('通关后才能扫荡', 'bad');
  const s = ensureSweep();
  if (s.used < BALANCE.sweep.daily) {
    s.used++;
  } else if ((state.cons.ticket || 0) > 0) {
    state.cons.ticket--;
    s.used++;
  } else {
    return toast('今日免费扫荡次数已用完，也没有扫荡券了', 'bad');
  }
  const map = getMap(stage.map);
  const fake = {
    stageNo: no, mapId: stage.map, affixes: [], isBoss: stage.isBoss,
    mods: { gold: 1, equipDrop: 1 }, flags: {}, eliteKills: 0
  };
  const rewards = computeRewards(fake, { firstClear: false });
  const sum = grantRewards(rewards, fake);
  state.stats.kills += 1;
  saveGame();
  renderAll();
  const loot = [`🪙 ${fmt(rewards.gold)}`, `✨ ${fmt(rewards.exp)}`];
  Object.keys(rewards.mats).forEach(id => { if (rewards.mats[id]) loot.push(`${(MATERIALS[id] || {}).icon || '📦'}×${rewards.mats[id]}`); });
  sum.items.forEach(it => loot.push(`${it.icon}${it.name}`));
  toast(`扫荡完成：${loot.join(' · ')}`, 'ok');
  playSfx('coin');
  closeModal();
}

/* ---------- 3.9 商店 ---------- */
function ensureShop() {
  const today = todayKey();
  if (!state.shop || state.shop.date !== today || !Array.isArray(state.shop.items) || !state.shop.items.length) {
    state.shop = { date: today, items: rollShop(state.level, highestCleared()) };
    saveGame();
  }
}
function refreshShop() {
  if (state.gold < BALANCE.shop.refreshCost) return toast('金币不足（需要 ' + BALANCE.shop.refreshCost + '）', 'bad');
  addGold(-BALANCE.shop.refreshCost);
  state.shop = { date: todayKey(), items: rollShop(state.level, highestCleared()) };
  saveGame();
  renderAll();
  toast('商店已刷新', 'ok');
}
function buyShopItem(idx) {
  ensureShop();
  const it = state.shop.items[idx];
  if (!it || it.sold) return;
  if (it.kind === 'equip' && state.inv.length >= state.bagSize) return toast('背包已满，无法购买装备', 'bad');
  const price = it.finalPrice != null ? it.finalPrice : it.price;
  if (it.currency === 'gems') {
    if (state.gems < price) return toast('钻石不足', 'bad');
    addGems(-price);
  } else {
    if (state.gold < price) return toast('金币不足', 'bad');
    addGold(-price);
  }
  if (it.kind === 'cons') addMat(it.id, it.count);
  else if (it.kind === 'mat') addMat(it.id, it.count);
  else if (it.kind === 'equip') {
    const added = addItem(it.item);
    if (!added) return;
  }
  it.sold = true;
  saveGame();
  renderAll();
  toast('购买成功：' + it.name, 'ok');
  playSfx('coin');
}
function buyFixed(kind) {
  if (kind === 'stone') {
    if (state.gold < 300) return toast('金币不足', 'bad');
    addGold(-300); addMat('stone', 5); toast('购买强化石 ×5', 'ok');
  } else if (kind === 'potion') {
    if (state.gold < 240) return toast('金币不足', 'bad');
    addGold(-240); addMat('potion', 3); toast('购买生命药水 ×3', 'ok');
  } else if (kind === 'bag') {
    const expansions = Math.round((state.bagSize - BALANCE.bag.base) / BALANCE.bag.expand);
    if (expansions >= BALANCE.bag.maxExpand) return toast('背包已扩容到上限', '');
    if (state.gems < BALANCE.bag.costGems) return toast('钻石不足', 'bad');
    addGems(-BALANCE.bag.costGems);
    state.bagSize += BALANCE.bag.expand;
    toast(`背包扩容 +${BALANCE.bag.expand}（当前 ${state.bagSize} 格）`, 'ok');
  } else if (kind === 'ticket') {
    if (state.gold < 500) return toast('金币不足', 'bad');
    addGold(-500); addMat('ticket', 2); toast('购买扫荡券 ×2', 'ok');
  }
  saveGame();
  renderAll();
  playSfx('coin');
}

/* ---------- 3.10 宝箱 ---------- */
function openChest(chestId, count) {
  if (ui.chestBusy) return;
  const cfg = CHESTS[chestId];
  const single = cfg.cost;
  const total = count === 10 ? Math.round(single * 9) : single;
  if (cfg.currency === 'gems') {
    if (state.gems < total) return toast('钻石不足', 'bad');
    addGems(-total);
  } else {
    if (state.gold < total) return toast('金币不足', 'bad');
    addGold(-total);
  }
  const ilvl = Math.max(1, highestCleared());
  const res = rollChest(chestId, ilvl, count, state.chestPity[chestId] || 0);
  state.chestPity[chestId] = res.pity;
  res.items.forEach(it => addItem(it));
  Object.keys(res.mats).forEach(id => addMat(id, res.mats[id]));
  if (res.gold) addGold(res.gold);
  saveGame();
  renderAll();
  playSfx('chest');
  showChestModal(cfg, res, count);
}
function showChestModal(cfg, res, count) {
  ui.chestBusy = true;
  const bestColor = RARITY_BY_ID[res.items.reduce((a, it) => Math.max(a, it.rarity), 0)].color;
  const body = `
    <div class="modal-head"><h3>${cfg.icon} ${cfg.name} ×${count}</h3><button class="modal-close" data-close="1">✕</button></div>
    <div class="chest-stage">
      <div class="beam on" style="background:radial-gradient(circle,${bestColor}88,transparent 70%)"></div>
      <div class="chest-big shake" id="chest-emoji">${cfg.icon}</div>
    </div>
    <div id="chest-reveal" class="reveal-list"></div>
    <div class="modal-foot"><button class="btn ghost" data-close="1" id="chest-skip">跳过动画</button></div>`;
  openModal(body);
  const emoji = document.getElementById('chest-emoji');
  const list = document.getElementById('chest-reveal');
  const reveal = () => {
    if (!ui.chestBusy) return;
    ui.chestBusy = false;
    if (emoji) { emoji.classList.remove('shake'); emoji.classList.add('open'); }
    const skipBtn = document.getElementById('chest-skip');
    if (skipBtn) skipBtn.textContent = '收下全部';
    if (!list) return;
    list.innerHTML = '';
    res.items.forEach((it, i) => {
      setTimeout(() => {
        if (!document.getElementById('chest-reveal')) return;
        const div = document.createElement('div');
        div.className = 'reveal-item r-' + RARITY_BY_ID[it.rarity].key;
        div.innerHTML = `<span style="font-size:20px">${it.icon}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;color:${RARITY_BY_ID[it.rarity].color}">${it.name}</div>
            <div class="tiny muted">${SLOTS[it.slot].name} · ${RARITY_BY_ID[it.rarity].name} · iLv ${it.ilvl}</div>
          </div>`;
        list.appendChild(div);
      }, i * 90);
    });
    const extra = document.createElement('div');
    extra.className = 'tiny muted mt6';
    const matsTxt = Object.keys(res.mats).map(id => `${(MATERIALS[id] || {}).icon || ''}${(MATERIALS[id] || {}).name || id}×${res.mats[id]}`).join(' ');
    extra.textContent = matsTxt + (res.gold ? ` 🪙×${res.gold}` : '');
    setTimeout(() => {
      if (!document.getElementById('chest-reveal')) return;
      list.appendChild(extra);
    }, res.items.length * 90 + 60);
  };
  const timer = setTimeout(reveal, 900);
  const skip = document.getElementById('chest-skip');
  if (skip) skip.onclick = () => { clearTimeout(timer); reveal(); };
  closeModalHooks.push(() => { clearTimeout(timer); ui.chestBusy = false; });
}

/* ---------- 3.11 图纸 / 锻造 / 商人 ---------- */
function craftBlueprint(id) {
  const bp = BLUEPRINTS[id];
  if (!bp) return;
  if (state.inv.length >= state.bagSize) return toast('背包已满，先清理或扩容', 'bad');
  if (!(state.blueprints[id] > 0)) return toast('还没有这张图纸', 'bad');
  const missing = [];
  Object.keys(bp.mats).forEach(mid => { if (matCount(mid) < bp.mats[mid]) missing.push(MATERIALS[mid].name); });
  if (missing.length) return toast('材料不足：' + missing.join('、'), 'bad');
  if (state.gold < bp.gold) return toast('金币不足', 'bad');
  Object.keys(bp.mats).forEach(mid => addMat(mid, -bp.mats[mid]));
  addGold(-bp.gold);
  state.blueprints[id]--;
  if (state.blueprints[id] <= 0) delete state.blueprints[id];
  const item = rollEquipment({
    slot: bp.slot, ilvl: Math.max(1, getMap(bp.map).startStage + 9),
    rarity: bp.rarity, name: bp.name, special: bp.special, boosts: false
  });
  const added = addItem(item);
  saveGame();
  renderAll();
  if (added) {
    toast(`锻造成功：${item.name}（${RARITY_BY_ID[item.rarity].name}）`, 'gold');
    playSfx('up');
    openItemModal(item.uid);
  }
}
function buyMerchant(mapId, kind) {
  const map = getMap(mapId);
  if (kind === 'stone') {
    if (matCount(map.mats.common) < 4) return toast('本地材料不足（需要 4 个' + MATERIALS[map.mats.common].name + '）', 'bad');
    addMat(map.mats.common, -4); addMat('stone', 6);
    toast('兑换：强化石 ×6', 'ok');
  } else if (kind === 'potion') {
    if (matCount(map.mats.rare) < 2) return toast('稀有材料不足（需要 2 个' + MATERIALS[map.mats.rare].name + '）', 'bad');
    addMat(map.mats.rare, -2); addMat('potion', 4);
    toast('兑换：生命药水 ×4', 'ok');
  } else if (kind.indexOf('bp_') === 0) {
    const bp = BLUEPRINTS[kind];
    if (!bp) return;
    if (state.gold < bp.gold * 2) return toast('金币不足', 'bad');
    if (matCount(map.mats.common) < 5 || matCount(map.mats.rare) < 1) return toast('本地材料不足', 'bad');
    addGold(-bp.gold * 2);
    addMat(map.mats.common, -5);
    addMat(map.mats.rare, -1);
    state.blueprints[kind] = (state.blueprints[kind] || 0) + 1;
    toast('购得图纸：' + bp.name, 'gold');
  }
  saveGame();
  renderAll();
  openMerchantModal(mapId);
}

/* ---------- 3.12 转职 ---------- */
function reclass(classId) {
  const cost = 200;
  if (classId === state.classId) return toast('已经是这个职业了', '');
  if (state.gems < cost) return toast('转职需要 ' + cost + ' 钻石', 'bad');
  addGems(-cost);
  state.classId = classId;
  state.freePoints += state.points.hp + state.points.atk + state.points.def + state.points.spd;
  state.points = { hp: 0, atk: 0, def: 0, spd: 0 };
  saveGame();
  closeModal();
  renderAll();
  toast('转职成功：' + CLASSES[classId].name, 'gold');
  playSfx('up');
}

function envMeta(map, b) {
  const id = b && b.envId === 'rift' ? (b.riftEnv || 'forest') : map.envId;
  return ENV_META[id] || ENV_META.forest;
}
function statusHtml(u) {
  const out = [];
  if (u.poison && u.poison.stacks > 0) out.push('☠' + u.poison.stacks);
  if (u.stun > 0) out.push('💫' + u.stun);

      <div class="log-list" id="battle-log">${logHtml(b)}</div>
    </aside>
  </div>`;
  const list = document.getElementById('battle-log');
  if (list) list.scrollTop = list.scrollHeight;
  ui.lastLogLen = b && b.logs ? b.logs.length : 0;
}
function syncBattle() {
  const b = ui.battle;
  if (!b || ui.tab !== 'battle') return;
  const arena = document.getElementById('arena');
  if (!arena) { renderBattleScreen(); return; }
  const enemyUnits = b.units.filter(u => u.side === 'enemy' && u.wave === b.wave);
  const enemyCards = arena.querySelectorAll('.team.enemies .unit').length;
  if (arena.dataset.wave !== String(b.wave) || enemyCards !== enemyUnits.length) {
    arena.dataset.wave = String(b.wave);
    arena.innerHTML = arenaInner(b, getMap(b.mapId), getStage(b.stageNo));
  }
  b.units.filter(u => u.side === 'ally' || u.wave === b.wave).forEach(u => {
    const el = arena.querySelector('.unit[data-uid="' + u.uid + '"]');
    if (!el) return;
    el.classList.toggle('dead', !u.alive);
    el.classList.toggle('acting', b.actorId === u.uid);
    const bar = el.querySelector('.hpbar > i');
    if (bar) bar.style.width = clamp(u.hp / u.maxHp * 100, 0, 100) + '%';
    const txt = el.querySelector('.hptxt');
    if (txt) txt.textContent = fmt(u.hp) + ' / ' + fmt(u.maxHp);
    const st = el.querySelector('.statuses');
    if (st) st.innerHTML = statusHtml(u);
  });
  const controls = document.getElementById('battle-controls');
  if (controls) controls.innerHTML = controlsHtml(b);
  const skills = document.getElementById('skillbar');
  if (skills) skills.innerHTML = skillbarHtml(b);
  const log = document.getElementById('battle-log');
  if (log) {
    const len = b.logs ? b.logs.length : 0;
    if (ui.lastLogLen !== len) {
      log.innerHTML = logHtml(b);
      log.scrollTop = log.scrollHeight;
      ui.lastLogLen = len;
    }
  }
  const title = document.querySelector('.log-panel .panel-title .sub');
  if (title) title.textContent = '第 ' + b.round + ' 回合';
}
function usePotion() {
  const b = ui.battle;
  if (!b || b.finished) return toast('当前没有进行中的战斗', '');
  const p = b.units.find(u => u.isPlayer);
  if (!p || !p.alive) return;
  if ((state.cons.potion || 0) <= 0) return toast('没有生命药水了', 'bad');
  if ((b.potionsUsed || 0) >= 2) return toast('本场战斗最多使用 2 次药水', '');
  state.cons.potion--;
  b.potionsUsed = (b.potionsUsed || 0) + 1;
  const before = p.hp;
  p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.3);
  const healed = Math.round(p.hp - before);
  appendBattleLog(`🧴 ${p.name} 喝下生命药水，回复 ${fmt(healed)} 生命`, 'l-ally');
  applyBattleEvents([{ k: 'fx', uid: p.uid, v: healed, heal: true }]);
  saveGame();
  syncBattle();
  renderTopbar();
  toast('使用生命药水：+' + fmt(healed), 'ok');
}
function retreat() {
  const b = ui.battle;
  if (!b || b.finished) return;
  clearTimeout(ui.timer);
  b.finished = true;
  b.win = false;
  ui.battle = null;
  ui.paused = false;
  ui.resultShown = false;
  renderAll();
  toast('已撤退（不消耗任何资源）', '');
}

function toast(msg, type) {
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  wrap.appendChild(d);
  while (wrap.children.length > 4) wrap.removeChild(wrap.firstChild);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 280); }, 2400);
}

let audioCtx = null;
const SFX = {
  click: { f: 520, d: 0.05, v: 0.02, slide: 1.1 },
  hit: { f: 180, d: 0.07, v: 0.025, slide: 0.7 },
  crit: { f: 660, d: 0.13, v: 0.035, slide: 1.6 },
  win: { f: 740, d: 0.28, v: 0.035, slide: 1.5 },
  lose: { f: 140, d: 0.4, v: 0.04, slide: 0.5 },
  coin: { f: 980, d: 0.07, v: 0.025, slide: 1.25 },
  up: { f: 560, d: 0.2, v: 0.035, slide: 1.9 },
  chest: { f: 320, d: 0.32, v: 0.035, slide: 2.2 }
};
function playSfx(kind) {
  if (!state || !state.settings.sound) return;
  const cfg = SFX[kind];
  if (!cfg) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = kind === 'hit' ? 'triangle' : kind === 'lose' ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(cfg.f, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, cfg.f * cfg.slide), t + cfg.d);
    gain.gain.setValueAtTime(cfg.v, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + cfg.d + 0.02);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + cfg.d + 0.03);
  } catch (e) { }
}
