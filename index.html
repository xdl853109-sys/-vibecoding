    <div class="tiny muted mt6">只收本地材料。用旧地图的材料换图纸和补给，是回头刷图的意义所在。</div>
    <div class="hr"></div>
    <div class="grid" style="gap:8px">
      ${bps.map(id => {
    const bp = BLUEPRINTS[id];
    return `<div class="blueprint-card">
          <div class="bp-ico">${bp.icon}</div>
          <div><div class="bp-name">${bp.name} 图纸 <span class="tag gold">已有 ${state.blueprints[id] || 0}</span></div>
          <div class="tiny muted">${SLOTS[bp.slot].name} · ${RARITY_BY_ID[bp.rarity].name}${bp.special ? ' · ' + MAP_SPECIALS[bp.special].name : ''}</div></div>
          <button class="btn sm ghost" data-act="merchant-buy" data-map="${mapId}" data-kind="${id}">
            兑换<span class="price">🪙${fmt(bp.gold * 2)} + ${MATERIALS[map.mats.common].icon}5 + ${MATERIALS[map.mats.rare].icon}1</span>
          </button>
        </div>`;
  }).join('')}
      <div class="blueprint-card">
        <div class="bp-ico">🔧</div>
        <div><div class="bp-name">强化石 ×6</div><div class="tiny muted">装备强化必需材料</div></div>
        <button class="btn sm ghost" data-act="merchant-buy" data-map="${mapId}" data-kind="stone">兑换<span class="price">${MATERIALS[map.mats.common].icon}4</span></button>
      </div>
      <div class="blueprint-card">
        <div class="bp-ico">🧴</div>
        <div><div class="bp-name">生命药水 ×4</div><div class="tiny muted">战斗内回复 30% 生命</div></div>
        <button class="btn sm ghost" data-act="merchant-buy" data-map="${mapId}" data-kind="potion">兑换<span class="price">${MATERIALS[map.mats.rare].icon}2</span></button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close="1">关闭</button></div>`;
  openModal(modalHtml);
}
function openSettingsModal() {
  const s = state.settings;
  const saved = state.savedAt ? new Date(state.savedAt).toLocaleString('zh-CN') : '尚未保存';
  const code = exportSave();
  const modalHtml = `
    <div class="modal-head"><h3>⚙️ 设置</h3><button class="modal-close" data-close="1">✕</button></div>
    <div class="setting-row">
      <div class="sl">战斗速度<small>只影响动画节奏，不影响伤害计算</small></div>
      <div class="seg">${[1, 2, 3].map(v => `<button class="${s.speed === v ? 'on' : ''}" data-act="set-speed" data-v="${v}">${v}x</button>`).join('')}</div>
    </div>
    <div class="setting-row">
      <div class="sl">手动释放技能<small>开启后，你的回合会暂停并等待选择技能</small></div>
      <button class="btn sm ${s.manual ? 'primary' : 'ghost'}" data-act="toggle-setting" data-key="manual">${s.manual ? '已开启' : '已关闭'}</button>
    </div>
    <div class="setting-row">
      <div class="sl">自动连战<small>胜利后自动进入下一关，直到失败或手动停止</small></div>
      <button class="btn sm ${s.autoChain ? 'primary' : 'ghost'}" data-act="toggle-setting" data-key="autoChain">${s.autoChain ? '已开启' : '已关闭'}</button>
    </div>
    <div class="setting-row">
      <div class="sl">音效<small>使用 WebAudio 实时合成，无外部音频文件</small></div>
      <button class="btn sm ${s.sound ? 'primary' : 'ghost'}" data-act="toggle-setting" data-key="sound">${s.sound ? '开' : '关'}</button>
    </div>
    <div class="setting-row">
      <div class="sl">关闭动效<small>降低视觉特效，适合低配设备</small></div>
      <button class="btn sm ${s.reduceMotion ? 'primary' : 'ghost'}" data-act="toggle-setting" data-key="reduceMotion">${s.reduceMotion ? '已开启' : '已关闭'}</button>
    </div>
    <div class="hr"></div>
    <div class="panel-title">导出存档<span class="sub">自动保存于 ${saved}</span></div>
    <textarea id="export-area" readonly>${code}</textarea>
    <div class="row mt6"><button class="btn sm ghost" data-act="export-copy">复制存档码</button><span class="tiny dim">存档自动保存到浏览器本地，换设备请复制存档码。</span></div>
    <div class="panel-title mt14">导入存档</div>
    <textarea id="import-area" placeholder="把存档码粘贴到这里，然后点击导入"></textarea>
    <div class="row mt6"><button class="btn sm" data-act="import-do">导入存档</button><span class="tiny dim">导入前会校验格式，格式错误不会覆盖当前存档。</span></div>
    <div class="hr"></div>
    <div class="row between">
      <span class="tiny dim">存档 key：${BALANCE.saveKey}</span>
      <button class="btn sm danger" data-act="reset-game">重置存档</button>
    </div>
    <div class="modal-foot"><button class="btn primary" data-close="1">完成</button></div>`;
  openModal(modalHtml);
}
function openClassSelect(mode) {
  const isRe = mode === 'reclass';
  const modalHtml = `
    <div class="modal-head"><h3>${isRe ? '转职祭坛（200 💎）' : '选择你的职业'}</h3>${isRe ? '<button class="modal-close" data-close="1">✕</button>' : ''}</div>
    <div class="tiny muted">${isRe ? '转职会保留等级与装备，属性点全额返还，技能随职业更换。' : '五个职业玩法差异明显：坦克反击、爆发闪避、破甲重击、中毒 AOE、法术吸血。选择后即可开始战斗。'}</div>
    <div class="grid mt10" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
      ${CLASS_ORDER.map(id => {
    const c = CLASSES[id];
    return `<div class="panel flat" style="border-color:${c.color}44">
          <div class="row"><span style="font-size:30px">${c.icon}</span>
            <div><div style="font-weight:900;color:${c.color}">${c.name}</div>
            <div class="tiny muted">${c.race} · ${c.role} · ${ELEMENTS[c.elem].icon}${ELEMENTS[c.elem].name}</div></div>
          </div>
          <div class="tiny mt6" style="min-height:34px">${c.mech}</div>
          <div class="row mt6 tiny">
            ${c.skills.map(sid => `<span class="tag" title="${SKILLS[sid].desc}">${state && state.level >= SKILLS[sid].unlock ? '' : '🔒'}${SKILLS[sid].icon}${SKILLS[sid].name}</span>`).join('')}
          </div>
          <div class="row between mt6 tiny muted">
            <span>成长：${c.weights.hp >= 2 ? '高生命' : c.weights.atk >= 3 ? '高攻击' : '均衡'}${c.weights.spd >= 2 ? ' / 高速度' : ''}</span>
            <button class="btn sm" data-act="choose-class" data-cls="${id}" ${isRe && state && state.classId === id ? 'disabled' : ''}>${isRe && state && state.classId === id ? '当前职业' : '选择'}</button>
          </div>
        </div>`;
  }).join('')}
    </div>
    ${isRe ? '<div class="modal-foot"><button class="btn ghost" data-close="1">取消</button></div>' : '<div class="tiny dim center mt10">开局赠送：训练长剑 · 生命药水 ×3 · 强化石 ×2 · 300 金币</div>'}`;
  openModal(modalHtml, { noclose: !isRe, wide: true });
}
function renderClassGate() {
  const root = document.getElementById('modal-root');
  if (root && !root.hidden) return;
  openClassSelect('new');
}
function confirmModal(title, text, okText, act, extra) {
  openModal(`
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" data-close="1">✕</button></div>
    <div class="muted" style="font-size:13px">${text}</div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="1">取消</button>
      <button class="btn danger" data-act="${act}" ${extra || ''}>${okText}</button>
    </div>`);
}

/* ============================ 事件分发 ============================ */
function handleAction(act, el) {
  const d = el.dataset || {};
  switch (act) {
    /* 导航 */
    case 'settings': openSettingsModal(); break;
    case 'open-map': {
      const map = getMap(d.map);
      if (!mapUnlocked(map)) return toast('未解锁：' + mapUnlockText(map), 'bad');
      ui.openMap = d.map;
      ui.mapView = 'map';
      if (state.current.mapId !== d.map) {
        const stages = STAGES.filter(s => s.map === d.map);
        const firstOpen = stages.find(s => !stageStars(s.no)) || stages[0];
        state.current = { mapId: d.map, stageNo: firstOpen.no };
      }
      saveGame();
      renderAll();
      break;
    }
    case 'back-world': ui.mapView = 'world'; ui.openMap = null; renderAll(); break;
    case 'goto-current': ui.tab = 'map'; ui.openMap = state.current.mapId; ui.mapView = 'map'; renderAll(); break;
    case 'select-stage': {
      const st = getStage(+d.no);
      const unlock = stageUnlocked(st);
      if (!unlock.ok) return toast(unlock.reason, 'bad');
      selectStage(st.no);
      break;
    }
    case 'start-battle': startBattle(state.current.stageNo); break;
    case 'retry-battle': retryBattle(); break;
    case 'next-battle': nextBattle(); break;
    case 'back-map': closeModal(); ui.tab = 'map'; ui.mapView = 'map'; ui.openMap = getMap(state.current.mapId).id; renderAll(); break;
    case 'sweep-stage': sweepStage(+d.no || state.current.stageNo); break;
    case 'claim-star': claimStarReward(d.map, +d.t); break;

    /* 战斗内 */
    case 'toggle-pause':
      ui.paused = !ui.paused;
      if (!ui.paused) scheduleTick(120);
      renderBattleScreen();
      break;
    case 'set-speed':
      setSpeed(+d.v);
      if (document.getElementById('export-area')) openSettingsModal();
      break;
    case 'toggle-manual': {
      state.settings.manual = !state.settings.manual;
      if (ui.battle) ui.battle.manual = state.settings.manual;
      saveGame();
      renderBattleScreen();
      toast(state.settings.manual ? '已切换：手动释放技能' : '已切换：自动释放技能', '');
      break;
    }
    case 'use-potion': usePotion(); break;
    case 'retreat': retreat(); break;
    case 'use-skill': {
      if (!ui.battle || ui.battle.finished) return;
      if (ui.battle.manual && !ui.waitingSkill) return;
      if (ui.paused) return;
      battleTick(d.skill === 'basic' ? 'basic' : d.skill);
      break;
    }

    /* 词缀 / 商人 */
    case 'open-affix': openAffixModal(d.map || state.current.mapId); break;
    case 'toggle-affix': toggleAffix(d.map, d.id); break;
    case 'confirm-affix': {
      closeModal();
      const map = getMap(d.map);
      if (state.current.mapId !== d.map) {
        const stages = STAGES.filter(s => s.map === d.map);
        const target = stages.find(s => stageStars(s.no) === 0) || stages[stages.length - 1];
        state.current = { mapId: d.map, stageNo: target.no };
      }
      startBattle(state.current.stageNo, { force: true });
      break;
    }
    case 'open-merchant': openMerchantModal(d.map || state.current.mapId); break;
    case 'merchant-buy': buyMerchant(d.map, d.kind); break;

    /* 角色 */
    case 'add-point': {
      const lvup = addPoint(d.stat);
      break;
    }
    case 'auto-points': autoPoints(); break;
    case 'reset-points': resetPoints(); break;
    case 'open-reclass': openClassSelect('reclass'); break;
    case 'choose-class': {
      if (!state) { newGame(d.cls); break; }
      if (state.classId === d.cls) { closeModal(); break; }
      reclass(d.cls);
      break;
    }

    /* 背包 / 装备 */
    case 'bag-tab': ui.bagTab = d.tab; renderBagScreen(); break;
    case 'open-bag': switchTab('bag'); break;
    case 'open-item': openItemModal(d.uid); break;
    case 'equip-item': equipItem(d.uid); break;
    case 'unequip-item': unequipSlot(d.slot); break;
    case 'enhance-item': enhanceItem(d.uid); break;
    case 'lock-item': toggleLock(d.uid); break;
    case 'decompose-item': {
      const it = findItem(d.uid);
      if (!it) break;
      if (it.rarity >= 3) confirmModal('分解确认', `确定分解「${it.name}」吗？可获得 ${fmt(itemDustValue(it))} 魔尘，该操作不可撤销。`, '确定分解', 'do-decompose', `data-uid="${d.uid}"`);
      else decomposeItem(d.uid);
      break;
    }
    case 'do-decompose': decomposeItem(d.uid); break;
    case 'sell-item': {
      const it = findItem(d.uid);
      if (!it) break;
      if (it.rarity >= 3) confirmModal('出售确认', `确定出售「${it.name}」吗？可获得 ${fmt(itemSellPrice(it))} 金币。`, '确定出售', 'do-sell', `data-uid="${d.uid}"`);
      else sellItem(d.uid);
      break;
    }
    case 'do-sell': sellItem(d.uid); break;
    case 'reforge-item': {
      const sel = document.getElementById('reforge-lock');
      reforgeItem(d.uid, sel ? sel.value : '');
      break;
    }
    case 'best-equip': bestEquip(); break;
    case 'sell-trash': sellTrash(); break;
    case 'buy-bag': buyFixed('bag'); break;

    /* 锻造 */
    case 'craft-bp': craftBlueprint(d.id); break;

    /* 商店 */
    case 'shop-refresh': refreshShop(); break;
    case 'shop-buy': buyShopItem(+d.idx); break;
    case 'buy-fixed': buyFixed(d.kind); break;

    /* 宝箱 */
    case 'chest-open': openChest(d.id, +d.n || 1); break;

    /* 设置 */
    case 'toggle-setting': toggleSetting(d.key); openSettingsModal(); break;
    case 'export-copy': {
      const ta = document.getElementById('export-area');
      if (ta) {
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        if (!ok && navigator.clipboard) {
          navigator.clipboard.writeText(ta.value).then(() => toast('存档码已复制', 'ok')).catch(() => toast('请手动全选复制', ''));
        } else toast(ok ? '存档码已复制' : '请手动全选复制', ok ? 'ok' : '');
      }
      break;
    }
    case 'import-do': {
      const ta = document.getElementById('import-area');
      if (!ta || !ta.value.trim()) return toast('请先粘贴存档码', 'bad');
      if (importSave(ta.value.trim())) closeModal();
      break;
    }
    case 'reset-game': confirmModal('重置存档', '确定要删除当前存档并重新开始吗？此操作不可撤销，建议先导出存档。', '继续', 'confirm-reset'); break;
    case 'confirm-reset': {
      localStorage.removeItem(BALANCE.saveKey);
      state = null;
      ui.battle = null;
      clearTimeout(ui.timer);
      clearTimeout(ui.chainTimer);
      closeModal();
      renderAll();
      openClassSelect('new');
      toast('存档已重置', '');
      break;
    }
    default: break;
  }
}
function onClick(e) {
  const closeEl = e.target.closest('[data-close]');
  if (closeEl) {
    const root = document.getElementById('modal-root');
    if (root && root.dataset.noclose === '1') return;
    closeModal();
    return;
  }
  if (e.target.id === 'modal-root' && e.target.dataset.noclose !== '1') {
    closeModal();
    return;
  }
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { switchTab(tabEl.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  handleAction(el.dataset.act, el);
}
function onChange(e) {
  const cb = e.target;
  if (cb.dataset && cb.dataset.change === 'auto-chain') {
    state.settings.autoChain = !!cb.checked;
    saveGame();
    if (!state.settings.autoChain) clearTimeout(ui.chainTimer);
    else if (ui.battle && ui.battle.finished && ui.battle.win) {
      /* 在胜利结算界面勾选自动连战时，立即安排下一场 */
      const root = document.getElementById('modal-root');
      const nextNo = nextStageNo(getStage(ui.battle.stageNo));
      if (root && !root.hidden && nextNo && stageUnlocked(getStage(nextNo)).ok) {
        clearTimeout(ui.chainTimer);
        ui.chainTimer = setTimeout(() => {
          if (!state.settings.autoChain) return;
          closeModal();
          startBattle(nextNo);
        }, 1600);
      }
    }
    renderAll();
    toast(state.settings.autoChain ? '自动连战已开启' : '自动连战已关闭', '');
  }
}
function bindEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const root = document.getElementById('modal-root');
      if (root && !root.hidden && root.dataset.noclose !== '1') closeModal();
    }
  });
  window.addEventListener('beforeunload', () => { if (state) saveGame(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && state) saveGame();
  });
}

/* ============================ 初始化 ============================ */
function init() {
  bindEvents();
  state = loadGame();
  if (!state) {
    renderAll();
    return;
  }
  ensureShop();
  ensureSweep();
  applyMotion();
  renderAll();
  if (state.savedAt && Date.now() - state.savedAt > 6 * 3600 * 1000) {
    const hours = Math.floor((Date.now() - state.savedAt) / 3600000);
    setTimeout(() => toast(`欢迎回来，已离开 ${hours} 小时`, 'gold'), 400);
  }
  setInterval(() => {
    if (state && ui.tab === 'shop') {
      const before = state.shop.date;
      ensureShop();
      if (before !== state.shop.date) renderShopScreen();
    }
  }, 60000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
